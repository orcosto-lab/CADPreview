<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#202124" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>CADPreview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #e8eaed; font: 14px system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
      #cad-host { position: absolute; inset: 0; }
      #cad-container { position: absolute; inset: 0; touch-action: none; }
      .ml-ui-shortcut-toolbar-shell { display: none !important; }
      #inicio { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: #111; }
      #inicio h1 { margin: 0; font-size: 20px; font-weight: 600; }
      #inicio p { margin: 0; max-width: 32em; color: #9aa0a6; }
      #inicio label { display: inline-block; padding: 14px 22px; background: #1a73e8; color: #fff; border-radius: 10px; font-size: 16px; }
      #inicio input { display: none; }
      #estado { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 7; max-width: 85%; padding: 10px 16px; background: #202124e6; border-radius: 8px; text-align: center; display: none; white-space: pre-line; }
      #medidas { position: absolute; left: 8px; top: calc(8px + env(safe-area-inset-top)); z-index: 7; max-width: calc(100% - 16px); padding: 6px 10px; background: #202124cc; border-radius: 6px; font: 11px ui-monospace, monospace; white-space: pre-line; display: none; }
      #medidas.plegado { max-height: 1.4em; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="cad-host"><div id="cad-container"></div></div>
    <div id="inicio">
      <h1>CADPreview</h1>
      <p>Elige un archivo .dwg o .dxf, o compártelo con CADPreview desde otra app una vez instalada. Se procesa en tu dispositivo; no se sube a ningún sitio.</p>
      <label>Elegir archivo<input id="archivo" type="file" accept=".dwg,.dxf,application/acad,image/vnd.dwg,image/x-dwg,application/octet-stream" /></label>
    </div>
    <div id="estado"></div>
    <div id="medidas"></div>
    <script type="module" src="./src/pwa.ts"></script>
  </body>
</html>
