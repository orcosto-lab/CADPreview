<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>CADPreview - visor</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #e8eaed; font: 14px system-ui, sans-serif; overflow: hidden; }
      #cad-host { position: absolute; inset: 0; }
      #cad-container { position: absolute; inset: 0; }
      /* mini barra Deshacer / Rehacer / Borrar del visor: el dibujo no se puede modificar, así que se oculta */
      .ml-ui-shortcut-toolbar-shell { display: none !important; }
      #status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; max-width: 80%; padding: 10px 16px; background: #202124d9; border-radius: 8px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="cad-host"><div id="cad-container"></div></div>
    <div id="status">Esperando el archivo…</div>
    <script type="module" src="./src/viewer.ts"></script>
  </body>
</html>
